name: Publish Report

on:
  workflow_dispatch:
    inputs:
      html_content:
        description: 'Report HTML content'
        required: true
        type: string
      filename:
        description: 'Output filename without extension (e.g. 2026-08-18-apple)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Write HTML content to file
        env:
          HTML_CONTENT: ${{ inputs.html_content }}
        run: printf '%s' "$HTML_CONTENT" > report.html

      - name: Render PDF
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          mkdir -p reports
          node scripts/render-report.js "reports/$FILENAME.pdf"

      - name: Commit report
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "reports/$FILENAME.pdf"
          git commit -m "Add report: $FILENAME"
          git push
